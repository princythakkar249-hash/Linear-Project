# Render Blueprint: PostgreSQL + FastAPI backend + static React frontend, all on Render.
# One-click deploy: https://render.com/deploy?repo=https://github.com/YashviShah514/traffic-flow-network-analyzer
databases:
  - name: traffic-db
    plan: free

services:
  # ---- Backend API -------------------------------------------------------
  - type: web
    name: tfna-yashvi-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: traffic-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"          # the frontend proxies /api, so this is only needed if you call the API from elsewhere

  # ---- Frontend (static site) ---------------------------------------------
  - type: web
    name: tfna-yashvi-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
    routes:
      # Same-origin API: browser calls /api/... on the static site, Render forwards it to the backend.
      - type: rewrite
        source: /api/*
        destination: https://tfna-yashvi-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
